    <text x="170" y="59" font-family="sans-serif" font-size="9" font-weight="600" fill="#a7f3d0" text-anchor="middle">Thick Protective Mucus Layer (MUC2)</text>

    <!-- Cells -->
    <g transform="translate(30, 80)">
